name: "Armazi Personal Protection"
version: "1.0.0"
platform: "macOS"
description: "Consumer-facing security profile for macOS — identity, device and data protection, online safety, home network exposure, and privacy. Complements the CIS macOS Benchmark with the protections everyday users ask for."

# ──────────────────────────────────────────────────────────────
# Conventions used in this file
#
#   PASS:    the protection is in place
#   FAIL:    the protection is missing (scored checks count against you)
#   UNKNOWN: the setting could not be read (usually a macOS privacy
#            restriction — grant your terminal Full Disk Access)
#   MANUAL:  cannot be determined locally, verify it yourself
#
# Checks that depend on data macOS protects behind Full Disk Access
# (Safari preferences in particular) are `scored: false` so that a
# missing permission surfaces as a warning, never as a false failure.
# ──────────────────────────────────────────────────────────────

checks:

  # ──────────────────────────────────────────────
  # Identity & Account Protection
  # ──────────────────────────────────────────────

  - id: "P1.1"
    title: "A password vault is in use"
    description: "Store credentials in a password manager instead of reusing or memorising them."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        found=""
        accounts=$(defaults read MobileMeAccounts 2>/dev/null)
        if echo "$accounts" | grep -A4 "KEYCHAIN_SYNC" | grep -q "Enabled = 1"; then
          found="$found iCloud-Keychain"
        fi
        managers="1Password Bitwarden KeePassXC Dashlane Enpass NordPass Keeper Strongbox ProtonPass"
        for app in $managers; do
          if ls /Applications 2>/dev/null | grep -qi "$app" || ls "$HOME/Applications" 2>/dev/null | grep -qi "$app"; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "PASS: password vault available:$found"
        else
          echo "FAIL: no password vault detected (iCloud Keychain off, no manager installed)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Turn on iCloud Keychain (System Settings > Apple Account > iCloud > Passwords & Keychain) or install a password manager such as 1Password, Bitwarden, or KeePassXC."
    frameworks: ["nist-csf", "essentials", "soc"]

  - id: "P1.2"
    title: "Password AutoFill is enabled"
    description: "AutoFill only offers credentials on the real site, which blocks look-alike phishing pages."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari AutoFillPasswords 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "1" ]; then
          echo "PASS: Safari AutoFill for passwords is on"
        else
          echo "FAIL: Safari AutoFill for passwords is off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > AutoFill → enable 'User names and passwords'. Grant your terminal Full Disk Access (System Settings > Privacy & Security) if this check cannot read the setting."
    frameworks: ["nist-csf", "essentials"]

  - id: "P1.3"
    title: "Apple Account uses two-factor authentication"
    description: "Two-factor authentication stops a stolen password from being enough to take over your account."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        accounts=$(defaults read MobileMeAccounts 2>/dev/null)
        if [ -z "$accounts" ] || ! echo "$accounts" | grep -q "AccountID"; then
          echo "MANUAL: no Apple Account is signed in on this Mac — verify 2FA for any account you use at appleid.apple.com"
        elif echo "$accounts" | grep -qE "KEYCHAIN_SYNC|SECURE_BACKUP"; then
          echo "PASS: Apple Account uses services that require two-factor authentication"
        else
          echo "MANUAL: could not confirm two-factor authentication — verify it at appleid.apple.com"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Sign in at appleid.apple.com > Sign-In and Security > Two-Factor Authentication → turn on. Prefer security keys if your account supports them."
    frameworks: ["cis", "nist-csf", "essentials", "soc"]

  - id: "P1.4"
    title: "Guest account is off"
    description: "A guest account is an unauthenticated door into your Mac and its network."
    category: "identity_protection"
    level: 1
    scored: true
    audit:
      command: |
        val=$(defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>/dev/null)
        if [ -z "$val" ] || [ "$val" = "0" ]; then
          echo "PASS: guest account is disabled"
        else
          echo "FAIL: guest account is enabled"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Users & Groups > Guest User → turn off. Or run: sudo defaults write /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false"
    frameworks: ["cis", "iso", "essentials"]

  - id: "P1.5"
    title: "No plain-text credential files in personal folders"
    description: "Files named like passwords or credentials are the first thing malware and thieves look for."
    category: "identity_protection"
    level: 1
    scored: true
    audit:
      command: |
        hits=$(find "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" -maxdepth 3 -type f \
          \( -iname "*password*" -o -iname "*passwd*" -o -iname "*credential*" -o -iname "*secret*" \) \
          \( -iname "*.txt" -o -iname "*.csv" -o -iname "*.rtf" -o -iname "*.md" -o -iname "*.doc*" \) \
          2>/dev/null | wc -l | tr -d ' ')
        if [ "$hits" = "0" ]; then
          echo "PASS: no obvious credential files found in Desktop, Documents, or Downloads"
        else
          echo "FAIL: $hits file(s) look like stored credentials — move them into a password vault"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Move the contents into your password manager, then delete the files and empty the Trash."
    frameworks: ["iso", "nist-csf"]

  # ──────────────────────────────────────────────
  # Device & Data Security
  # ──────────────────────────────────────────────

  - id: "P2.1"
    title: "Disk is encrypted with FileVault"
    description: "FileVault makes a lost or stolen Mac useless to whoever ends up with it."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: "fdesetup status 2>&1"
      match:
        type: "contains"
        value: "FileVault is On"
    remediation: "System Settings > Privacy & Security > FileVault → Turn On. Store the recovery key somewhere safe."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.2"
    title: "Built-in malware protection is active"
    description: "Gatekeeper and XProtect are Apple's built-in endpoint protection — both must be on."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        gate=$(spctl --status 2>&1)
        sip=$(csrutil status 2>&1)
        problems=""
        echo "$gate" | grep -q "assessments enabled" || problems="$problems Gatekeeper-off"
        echo "$sip" | grep -qi "enabled" || problems="$problems SIP-off"
        if [ -z "$problems" ]; then
          echo "PASS: Gatekeeper and System Integrity Protection are enabled"
        else
          echo "FAIL:$problems"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Run: sudo spctl --master-enable to re-enable Gatekeeper. Re-enable SIP from Recovery: csrutil enable"
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.3"
    title: "Malware definitions are current"
    description: "XProtect signatures updated in the last 30 days mean your Mac knows about current malware families."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        bundle="/Library/Apple/System/Library/CoreServices/XProtect.bundle"
        [ -d "$bundle" ] || bundle="/System/Library/CoreServices/XProtect.bundle"
        if [ ! -d "$bundle" ]; then
          echo "UNKNOWN: XProtect bundle not found on this system"
          exit 0
        fi
        mtime=$(stat -f %m "$bundle/Contents/Info.plist" 2>/dev/null)
        if [ -z "$mtime" ]; then
          echo "UNKNOWN: could not read XProtect definition date"
          exit 0
        fi
        now=$(date +%s)
        age=$(( (now - mtime) / 86400 ))
        if [ "$age" -le 30 ]; then
          echo "PASS: malware definitions updated $age day(s) ago"
        else
          echo "FAIL: malware definitions are $age day(s) old"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install pending updates (System Settings > General > Software Update) and enable 'Install Security Responses and system files'."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "P2.4"
    title: "Security fixes install automatically"
    description: "Security responses and system data files are the patches that land between macOS releases."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        config=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall 2>/dev/null)
        critical=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall 2>/dev/null)
        if [ "$config" = "1" ] && [ "$critical" = "1" ]; then
          echo "PASS: security responses and system data files install automatically"
        else
          echo "FAIL: automatic security fixes are off (ConfigDataInstall=${config:-unset}, CriticalUpdateInstall=${critical:-unset})"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Software Update > (i) → enable 'Install Security Responses and system files'."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.5"
    title: "A recent backup exists"
    description: "A backup from the last 7 days is the difference between an incident and a disaster."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        dest=$(tmutil destinationinfo 2>&1)
        if echo "$dest" | grep -qi "no destinations"; then
          echo "FAIL: Time Machine has no backup destination configured"
          exit 0
        fi
        latest=$(tmutil latestbackup 2>/dev/null)
        if [ -z "$latest" ]; then
          echo "FAIL: a backup destination is configured but no completed backup was found"
          exit 0
        fi
        stamp=$(basename "$latest" | cut -d. -f1)
        then_epoch=$(date -j -f "%Y-%m-%d-%H%M%S" "$stamp" +%s 2>/dev/null)
        if [ -z "$then_epoch" ]; then
          echo "PASS: latest backup is $latest"
          exit 0
        fi
        age=$(( ($(date +%s) - then_epoch) / 86400 ))
        if [ "$age" -le 7 ]; then
          echo "PASS: latest backup is $age day(s) old ($stamp)"
        else
          echo "FAIL: latest backup is $age day(s) old ($stamp)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Time Machine → add a backup disk and let a backup complete. Keep at least one copy off-site or in the cloud."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.6"
    title: "Backups are encrypted"
    description: "An unencrypted backup disk hands over everything the encrypted Mac was protecting."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        dest=$(tmutil destinationinfo 2>&1)
        if echo "$dest" | grep -qi "no destinations"; then
          echo "FAIL: no Time Machine destination configured"
        elif echo "$dest" | grep -qi "encrypted.*yes\|Encryption Status.*Encrypted"; then
          echo "PASS: Time Machine destination is encrypted"
        else
          echo "FAIL: Time Machine destination is not encrypted"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Time Machine → remove the disk, add it again and tick 'Encrypt Backup'."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.7"
    title: "Local snapshots allow ransomware rollback"
    description: "APFS local snapshots let you roll a machine back to a point before files were encrypted or corrupted."
    category: "data_protection"
    level: 1
    scored: false
    audit:
      command: |
        snaps=$(tmutil listlocalsnapshotdates / 2>/dev/null | grep -c "^20")
        if [ "${snaps:-0}" -gt 0 ]; then
          echo "PASS: $snaps local snapshot(s) available for rollback"
        else
          echo "FAIL: no local snapshots — enable Time Machine so macOS keeps hourly snapshots"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Turn on Time Machine. macOS then keeps local APFS snapshots automatically, even when the backup disk is disconnected."
    frameworks: ["nist-csf", "soc"]

  - id: "P2.8"
    title: "Find My Mac is on"
    description: "Find My is what makes remote locate, lock, and wipe possible after a theft."
    category: "data_protection"
    level: 1
    scored: true
    audit:
      command: |
        if nvram -p 2>/dev/null | grep -q "fmm-mobileme-token-FMM"; then
          echo "PASS: Find My Mac is enabled"
        else
          echo "FAIL: Find My Mac is not enabled — remote lock and wipe are unavailable"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Apple Account > iCloud > Find My Mac → turn on, including 'Find My network'."
    frameworks: ["iso", "nist-csf", "essentials"]

  - id: "P2.9"
    title: "Installed apps are up to date"
    description: "Out-of-date apps and plugins are the most common way a fully patched Mac still gets compromised."
    category: "data_protection"
    level: 1
    scored: false
    audit:
      command: |
        if ! command -v brew >/dev/null 2>&1; then
          echo "PASS: Homebrew is not installed — nothing to check here (update other apps from the App Store or the vendor)"
          exit 0
        fi
        outdated=$(brew outdated --quiet 2>/dev/null | wc -l | tr -d ' ')
        if [ "${outdated:-0}" -eq 0 ]; then
          echo "PASS: all Homebrew packages are up to date"
        else
          echo "FAIL: $outdated Homebrew package(s) are out of date"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Run: brew update && brew upgrade. Enable automatic updates in the App Store for everything else."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "P2.10"
    title: "Deleted files are cleared out"
    description: "Emptying the Trash automatically limits how long deleted personal files stay recoverable."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.finder FXRemoveOldTrashItems 2>/dev/null)
        if [ "$val" = "1" ]; then
          echo "PASS: Finder removes Trash items after 30 days"
        elif [ -z "$val" ]; then
          echo "FAIL: automatic Trash cleanup is not enabled"
        else
          echo "FAIL: automatic Trash cleanup is off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Finder > Settings > Advanced → enable 'Remove items from the Trash after 30 days'. On a FileVault disk, deleted files are already unreadable once the Trash is emptied."
    frameworks: ["iso"]

  # ──────────────────────────────────────────────
  # Online Safety
  # ──────────────────────────────────────────────

  - id: "P3.1"
    title: "Browser warns about fraudulent sites"
    description: "Safari's fraudulent site warning is the last line of defence against a phishing link that made it through."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari WarnAboutFraudulentWebsites 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "1" ]; then
          echo "PASS: fraudulent website warnings are on"
        else
          echo "FAIL: fraudulent website warnings are off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > Security → enable 'Warn when visiting a fraudulent website'."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "P3.2"
    title: "Cross-site tracking is blocked"
    description: "Tracker blocking cuts both profiling and the ad networks that deliver malicious redirects."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari BlockStoragePolicy 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "2" ]; then
          echo "PASS: Safari blocks cookies and storage from third parties"
        else
          echo "FAIL: cross-site tracking prevention is weakened (BlockStoragePolicy=$val)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > Privacy → enable 'Prevent cross-site tracking'."
    frameworks: ["iso", "nist-csf"]

  - id: "P3.3"
    title: "Pop-ups are blocked"
    description: "Scareware and tech-support scams almost always arrive through an unsolicited pop-up window."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari "WebKitPreferences.javaScriptCanOpenWindowsAutomatically" 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "0" ]; then
          echo "PASS: Safari blocks pop-up windows"
        else
          echo "FAIL: Safari allows sites to open pop-up windows"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > Websites > Pop-up Windows → set 'When visiting other websites' to Block."
    frameworks: ["cis", "essentials"]

  - id: "P3.4"
    title: "Full website addresses are shown"
    description: "Seeing the whole URL is how you spot appl3-support.example.com before you type a password into it."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari ShowFullURLInSmartSearchField 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "1" ]; then
          echo "PASS: Safari shows the full website address"
        else
          echo "FAIL: Safari hides part of the website address"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > Advanced → enable 'Show full website address'."
    frameworks: ["cis", "essentials"]

  - id: "P3.5"
    title: "Downloads do not open automatically"
    description: "Auto-opening a download hands a malicious file the first execution it needs."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        val=$(defaults read com.apple.Safari AutoOpenSafeDownloads 2>/dev/null)
        if [ -z "$val" ]; then
          echo "UNKNOWN: Safari settings are not readable — grant your terminal Full Disk Access to audit them"
        elif [ "$val" = "0" ]; then
          echo "PASS: Safari does not auto-open downloaded files"
        else
          echo "FAIL: Safari opens 'safe' downloads automatically"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > General → disable 'Open \"safe\" files after downloading'."
    frameworks: ["cis", "iso", "essentials"]

  - id: "P3.6"
    title: "A content or tracker blocker is installed"
    description: "Blocking malicious ads and trackers removes a whole class of drive-by scams."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        blockers="AdGuard 1Blocker Wipr Ghostery uBlock StopTheMadness LittleSnitch Lulu NextDNS"
        found=""
        for app in $blockers; do
          if ls /Applications 2>/dev/null | grep -qi "$app" || ls "$HOME/Applications" 2>/dev/null | grep -qi "$app"; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "PASS: content blocking tools installed:$found"
        else
          echo "FAIL: no content or tracker blocker found"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install a reputable content blocker (AdGuard, 1Blocker, Wipr) or use a filtering DNS resolver such as NextDNS."
    frameworks: ["nist-csf"]

  # ──────────────────────────────────────────────
  # Home & Network Protection
  # ──────────────────────────────────────────────

  - id: "P4.1"
    title: "Firewall is on"
    description: "The firewall blocks unsolicited incoming connections on café and hotel networks alike."
    category: "home_network"
    level: 1
    scored: true
    elevated: true
    audit:
      command: "/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>&1"
      match:
        type: "contains"
        value: "enabled"
    remediation: "System Settings > Network > Firewall → turn on. Or run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on"
    frameworks: ["cis", "iso", "essentials", "soc"]

  - id: "P4.2"
    title: "Wi-Fi network is encrypted"
    description: "An open or WEP network exposes everything this Mac sends to anyone in range."
    category: "home_network"
    level: 1
    scored: false
    audit:
      command: |
        wifi_if=$(networksetup -listallhardwareports 2>/dev/null | awk '/Wi-Fi|AirPort/{getline; print $NF}')
        if [ -z "$wifi_if" ]; then
          echo "PASS: no Wi-Fi interface found (wired connection)"
          exit 0
        fi
        security=$(system_profiler SPAirPortDataType 2>/dev/null | grep -A12 "Current Network" | grep -i "security" | head -1)
        if echo "$security" | grep -qiE "WPA3|WPA2"; then
          echo "PASS: Wi-Fi uses modern encryption ($security)"
        elif echo "$security" | grep -qiE "WEP|none|open"; then
          echo "FAIL: Wi-Fi uses weak or no encryption ($security)"
        else
          echo "UNKNOWN: not connected to Wi-Fi, or the security type could not be read"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Set your home router to WPA3 (or WPA2-AES), give it a long unique passphrase, and change the router's admin password from the default."
    frameworks: ["iso", "essentials"]

  - id: "P4.3"
    title: "Mac is not listening on the network"
    description: "Every service listening on a network interface is a door other devices on the same Wi-Fi can knock on."
    category: "home_network"
    level: 1
    scored: false
    audit:
      command: |
        listeners=$(netstat -an 2>/dev/null | grep "LISTEN" | grep -v "127.0.0.1" | grep -v "::1" | wc -l | tr -d ' ')
        if [ "${listeners:-0}" -eq 0 ]; then
          echo "PASS: no services are listening on external interfaces"
        else
          ports=$(netstat -an 2>/dev/null | grep "LISTEN" | grep -v "127.0.0.1" | grep -v "::1" | awk '{print $4}' | sed 's/.*\.//' | sort -un | tr '\n' ' ')
          echo "FAIL: $listeners service(s) reachable from the network on port(s): $ports"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Sharing → turn off anything you do not use (File Sharing, Screen Sharing, Remote Login, Media Sharing)."
    frameworks: ["cis", "iso", "essentials"]

  - id: "P4.4"
    title: "AirDrop is not open to everyone"
    description: "'Everyone' means any stranger within Bluetooth range can send you files."
    category: "home_network"
    level: 1
    scored: true
    audit:
      command: |
        mode=$(defaults read com.apple.sharingd DiscoverableMode 2>/dev/null)
        if [ -z "$mode" ] || echo "$mode" | grep -qi "contacts only\|off"; then
          echo "PASS: AirDrop is limited (${mode:-macOS default: Contacts Only})"
        else
          echo "FAIL: AirDrop is discoverable by $mode"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Control Centre > AirDrop → Contacts Only, or Receiving Off when you are not using it."
    frameworks: ["cis", "essentials"]

  - id: "P4.5"
    title: "A VPN is available for public Wi-Fi"
    description: "A VPN protects traffic on networks you do not control — hotels, airports, cafés."
    category: "home_network"
    level: 2
    scored: false
    audit:
      command: |
        configs=$(scutil --nc list 2>/dev/null | grep -cE "\((Connected|Disconnected|Connecting|Disconnecting)\)")
        apps="Tailscale Mullvad ProtonVPN NordVPN ExpressVPN WireGuard OpenVPN Windscribe WARP"
        found=""
        for app in $apps; do
          if ls /Applications 2>/dev/null | grep -qi "$app"; then
            found="$found $app"
          fi
        done
        if [ "${configs:-0}" -gt 0 ] || [ -n "$found" ]; then
          echo "PASS: VPN available (${configs:-0} system config(s);$found)"
        else
          echo "FAIL: no VPN configuration or client found"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Configure a trusted zero-log VPN, or turn on iCloud Private Relay if you only need browsing protection."
    frameworks: ["nist-csf"]

  # ──────────────────────────────────────────────
  # Privacy & Personal Safety
  # ──────────────────────────────────────────────

  - id: "P5.1"
    title: "Analytics sharing is off"
    description: "Diagnostic and usage reports can carry fragments of what you were doing when something crashed."
    category: "privacy"
    level: 1
    scored: true
    audit:
      command: |
        plist="/Library/Application Support/CrashReporter/DiagnosticMessagesHistory.plist"
        val=$(defaults read "$plist" AutoSubmit 2>/dev/null)
        if [ -z "$val" ] || [ "$val" = "0" ]; then
          echo "PASS: analytics are not shared with Apple"
        else
          echo "FAIL: analytics and crash reports are shared automatically"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Analytics & Improvements → turn off 'Share Mac Analytics'."
    frameworks: ["cis", "iso"]

  - id: "P5.2"
    title: "Personalised ads are off"
    description: "Ad personalisation builds a profile of you from what you do on your own machine."
    category: "privacy"
    level: 1
    scored: true
    audit:
      command: |
        val=$(defaults read com.apple.AdLib allowApplePersonalizedAdvertising 2>/dev/null)
        if [ "$val" = "0" ]; then
          echo "PASS: personalised advertising is off"
        elif [ -z "$val" ]; then
          echo "FAIL: personalised advertising has not been turned off"
        else
          echo "FAIL: personalised advertising is on"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Apple Advertising → turn off 'Personalised Ads'."
    frameworks: ["cis", "iso"]

  - id: "P5.3"
    title: "IP address tracking is limited"
    description: "iCloud Private Relay hides your IP address and DNS lookups from network operators and trackers."
    category: "privacy"
    level: 2
    scored: false
    audit:
      command: |
        accounts=$(defaults read MobileMeAccounts 2>/dev/null)
        if [ -z "$accounts" ]; then
          echo "UNKNOWN: no Apple Account signed in — Private Relay is unavailable"
        elif echo "$accounts" | grep -A4 "PRIVATE_RELAY\|CLOUD_RELAY" | grep -q "Enabled = 1"; then
          echo "PASS: iCloud Private Relay is on"
        else
          echo "FAIL: iCloud Private Relay is off (requires iCloud+)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Apple Account > iCloud > Private Relay → turn on. Without iCloud+, use a trusted VPN or encrypted DNS instead."
    frameworks: ["iso", "nist-csf"]

  - id: "P5.4"
    title: "Computer name does not expose your identity"
    description: "The computer name is broadcast on every network you join, including hotel and café Wi-Fi."
    category: "privacy"
    level: 2
    scored: false
    audit:
      command: |
        name=$(scutil --get ComputerName 2>/dev/null)
        real=$(dscl . -read "/Users/$(whoami)" RealName 2>/dev/null | tail -1 | xargs)
        if [ -z "$name" ]; then
          echo "UNKNOWN: could not read the computer name"
          exit 0
        fi
        exposed=0
        for part in $real; do
          [ ${#part} -lt 3 ] && continue
          if echo "$name" | grep -qi "$part"; then
            exposed=1
          fi
        done
        if [ "$exposed" -eq 0 ]; then
          echo "PASS: computer name '$name' does not contain your name"
        else
          echo "FAIL: computer name '$name' contains your real name and is broadcast on every network"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > About > Name → use something neutral such as 'mbp-14'."
    frameworks: ["iso"]

  - id: "P5.5"
    title: "An encrypted messenger is available"
    description: "End-to-end encrypted messaging keeps private conversations and shared documents out of third-party hands."
    category: "privacy"
    level: 2
    scored: false
    audit:
      command: |
        apps="Signal Wire Threema Element Session Wickr Keybase ProtonMail Tutanota"
        found=""
        for app in $apps; do
          if ls /Applications 2>/dev/null | grep -qi "$app" || ls "$HOME/Applications" 2>/dev/null | grep -qi "$app"; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "PASS: encrypted communication tools installed:$found"
        else
          echo "FAIL: no dedicated encrypted messenger found (iMessage between Apple devices is still end-to-end encrypted)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install Signal for messaging, and share files with an end-to-end encrypted service rather than email attachments."
    frameworks: ["nist-csf", "soc"]
