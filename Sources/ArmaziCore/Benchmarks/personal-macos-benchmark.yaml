name: "Armazi Personal Security Benchmark"
version: "1.0.0"
platform: "macOS"
description: "Consumer-focused security checks for personal Macs — identity and account protection, backup and recovery, safe browsing, home network hygiene, and privacy. Complements the CIS macOS Benchmark rather than repeating it."

# ──────────────────────────────────────────────────────────────
# Notes for contributors
#
# * Checks run through /bin/sh. Keep commands POSIX — no [[ ]], no arrays.
# * Elevated checks are concatenated into one batch script, so they must
#   never call `exit` (it would terminate the whole batch).
# * Anything that cannot be determined reliably (sandboxed preferences,
#   optional tooling) prints "UNKNOWN: ..." and is marked scored: false,
#   so it surfaces as a warning to review rather than a false failure.
# ──────────────────────────────────────────────────────────────

checks:

  # ──────────────────────────────────────────────
  # Identity & Account Protection
  # ──────────────────────────────────────────────

  - id: "P1.1"
    title: "Authenticator app is available"
    description: "Use app-based multi-factor authentication instead of SMS codes, which can be intercepted by SIM-swap attacks."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        found=""
        for dir in /Applications "$HOME/Applications" /System/Applications; do
          [ -d "$dir" ] || continue
          match=$(ls "$dir" 2>/dev/null | grep -iE "authy|2fas|raivo|step two|otp auth|tofu|ente auth|authenticator|1password|bitwarden|keeper|enpass|proton pass|strongbox" | tr '\n' ' ')
          [ -n "$match" ] && found="$found $match"
        done
        if [ -n "$found" ]; then
          echo "PASS: authenticator-capable app(s) found:$found"
        else
          echo "WARNING: no authenticator app found on this Mac (a phone-based authenticator would not be visible here)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install an authenticator app (2FAS, Ente Auth, Raivo, or the TOTP feature of your password manager) and enroll your email, banking, and cloud accounts."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "P1.2"
    title: "Hardware security key is present"
    description: "Hardware keys (FIDO2/WebAuthn) are phishing-resistant — a fake login page cannot replay them."
    category: "identity_protection"
    level: 2
    scored: false
    audit:
      command: |
        keys=$(ioreg -p IOUSB -w0 2>/dev/null | grep -iE "yubikey|nitrokey|solokey|onlykey|titan|feitian|token2")
        if [ -z "$keys" ]; then
          keys=$(system_profiler SPUSBDataType 2>/dev/null | grep -iE "yubikey|nitrokey|solokey|onlykey|titan|feitian|token2")
        fi
        if [ -n "$keys" ]; then
          echo "PASS: hardware security key detected"
        else
          echo "WARNING: no hardware security key detected (it only shows up while plugged in)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Register a FIDO2 security key (YubiKey, Nitrokey, Titan) with your Apple Account, email provider, and password manager as a phishing-resistant second factor."
    frameworks: ["nist-csf", "essentials"]

  - id: "P1.3"
    title: "Signed in to an Apple Account"
    description: "An Apple Account is what enables Find My, iCloud Keychain, and Apple's compromised-password alerts."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        count=$(defaults read MobileMeAccounts 2>/dev/null | grep -c "AccountID")
        if [ "$count" -gt 0 ]; then
          echo "PASS: signed in to an Apple Account"
        else
          echo "WARNING: no Apple Account is signed in — Find My and iCloud Keychain are unavailable"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > [your name] > sign in with your Apple Account, then enable two-factor authentication for it."
    frameworks: ["nist-csf"]

  - id: "P1.4"
    title: "iCloud Keychain password syncing is on"
    description: "Syncing passwords keeps them available across devices and turns on Apple's alerts for passwords found in known data leaks."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        data=$(defaults read MobileMeAccounts 2>/dev/null)
        if [ -z "$data" ]; then
          echo "UNKNOWN: not signed in to an Apple Account"
        elif echo "$data" | grep -B4 -A4 "KEYCHAIN_SYNC" | grep -q "Enabled = 1"; then
          echo "PASS: iCloud Keychain syncing is enabled"
        else
          echo "WARNING: iCloud Keychain syncing appears to be off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > [your name] > iCloud > Passwords & Keychain → turn on. Then review Passwords > Security for leaked or reused passwords."
    frameworks: ["nist-csf", "essentials"]

  - id: "P1.5"
    title: "Guest account is disabled"
    description: "The guest account allows anyone with physical access to use the Mac without credentials."
    category: "identity_protection"
    level: 1
    scored: true
    elevated: true
    audit:
      command: |
        guest=$(defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>/dev/null)
        if [ "$guest" = "1" ]; then
          echo "FAIL: the guest account is enabled"
        else
          echo "PASS: the guest account is disabled"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Users & Groups > Guest User → turn off. Or run: sudo defaults write /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false"
    frameworks: ["cis", "iso", "essentials"]

  - id: "P1.6"
    title: "Password hints are disabled"
    description: "Password hints leak information about your password to anyone at the login window."
    category: "identity_protection"
    level: 1
    scored: true
    elevated: true
    audit:
      command: |
        hint=$(defaults read /Library/Preferences/com.apple.loginwindow RetriesUntilHint 2>/dev/null)
        if [ "$hint" = "0" ]; then
          echo "PASS: password hints are disabled"
        elif [ -z "$hint" ]; then
          echo "FAIL: password hints are not explicitly disabled"
        else
          echo "FAIL: a password hint is shown after $hint failed attempt(s)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "sudo defaults write /Library/Preferences/com.apple.loginwindow RetriesUntilHint -int 0"
    frameworks: ["cis", "iso", "essentials"]

  # ──────────────────────────────────────────────
  # Device & Data Security
  # ──────────────────────────────────────────────

  - id: "P2.1"
    title: "Find My Mac is enabled"
    description: "Find My is what makes remote locate, lock, and erase possible if the Mac is lost or stolen."
    category: "data_protection"
    level: 1
    scored: true
    elevated: true
    audit:
      command: |
        fmm=$(defaults read /Library/Preferences/com.apple.FindMyMac FMMEnabled 2>/dev/null)
        if [ "$fmm" = "1" ]; then
          echo "PASS: Find My Mac is enabled"
        else
          echo "FAIL: Find My Mac is not enabled — remote locate and erase are unavailable"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > [your name] > iCloud > Find My Mac → turn on, including 'Find My network'."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "P2.2"
    title: "A backup has run in the last 7 days"
    description: "A backup destination that has not run recently will not get your files back after ransomware, theft, or drive failure."
    category: "data_protection"
    level: 1
    scored: false
    elevated: true
    audit:
      command: |
        dates=$(defaults read /Library/Preferences/com.apple.TimeMachine Destinations 2>/dev/null | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} \+0000")
        last=$(printf '%s\n' "$dates" | grep -v '^$' | sort | tail -1)
        if [ -z "$last" ]; then
          echo "UNKNOWN: no completed backup date found (no destination configured, or backups have never finished)"
        else
          ts=$(date -j -u -f "%Y-%m-%d %H:%M:%S +0000" "$last" +%s 2>/dev/null)
          if [ -z "$ts" ]; then
            echo "UNKNOWN: could not parse the last backup date ($last)"
          else
            age=$(( ( $(date -u +%s) - ts ) / 86400 ))
            if [ "$age" -le 7 ]; then
              echo "PASS: last backup completed $age day(s) ago"
            else
              echo "FAIL: last backup completed $age day(s) ago"
            fi
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Reconnect the backup disk, or System Settings > General > Time Machine > Options and confirm the backup frequency. Keep one backup off-site or in the cloud."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "P2.3"
    title: "Versioned cloud storage is in use"
    description: "Cloud storage with version history lets you roll individual files back after corruption, accidental deletion, or ransomware."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        found=""
        data=$(defaults read MobileMeAccounts 2>/dev/null)
        if echo "$data" | grep -B4 -A4 "MOBILE_DOCUMENTS" | grep -q "Enabled = 1"; then
          found="$found iCloud-Drive"
        fi
        apps=$(ls /Applications 2>/dev/null | grep -iE "dropbox|google drive|onedrive|proton drive|box|sync\.com|tresorit" | tr '\n' ' ')
        [ -n "$apps" ] && found="$found $apps"
        if [ -n "$found" ]; then
          echo "PASS: versioned cloud storage in use:$found"
        else
          echo "WARNING: no versioned cloud storage detected"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Enable iCloud Drive (System Settings > [your name] > iCloud) or another provider with file version history, and keep your Documents and Desktop folders in it."
    frameworks: ["iso", "nist-csf"]

  - id: "P2.4"
    title: "Malware definitions are recent"
    description: "XProtect carries Apple's malware signatures. Definitions older than two months usually mean background updates are broken."
    category: "data_protection"
    level: 1
    scored: false
    audit:
      command: |
        bundle="/Library/Apple/System/Library/CoreServices/XProtect.bundle"
        [ -d "$bundle" ] || bundle="/System/Library/CoreServices/XProtect.bundle"
        info="$bundle/Contents/Info.plist"
        if [ ! -f "$info" ]; then
          echo "UNKNOWN: XProtect bundle not found"
        else
          version=$(defaults read "$bundle/Contents/Info" CFBundleShortVersionString 2>/dev/null)
          mtime=$(stat -f %m "$info" 2>/dev/null)
          if [ -z "$mtime" ]; then
            echo "UNKNOWN: could not read XProtect timestamp"
          else
            age=$(( ( $(date -u +%s) - mtime ) / 86400 ))
            if [ "$age" -le 60 ]; then
              echo "PASS: XProtect definitions (version $version) updated $age day(s) ago"
            else
              echo "FAIL: XProtect definitions (version $version) are $age day(s) old"
            fi
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Enable System Settings > General > Software Update > Automatic Updates > 'Install Security Responses and system files', then reconnect to the internet so definitions can refresh."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "P2.5"
    title: "Security responses install automatically"
    description: "Rapid Security Responses and system data files patch actively exploited flaws between full macOS releases."
    category: "data_protection"
    level: 1
    scored: true
    elevated: true
    audit:
      command: |
        config=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall 2>/dev/null)
        critical=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall 2>/dev/null)
        if [ "$config" = "1" ] && [ "$critical" = "1" ]; then
          echo "PASS: security responses and system data files install automatically"
        else
          echo "FAIL: automatic security responses are off (ConfigDataInstall=${config:-unset}, CriticalUpdateInstall=${critical:-unset})"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Software Update > Automatic Updates → turn on 'Install Security Responses and system files'."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "P2.6"
    title: "No pending macOS updates"
    description: "Reports updates macOS has already found but not installed. Unpatched flaws are the most common way consumer devices get compromised."
    category: "data_protection"
    level: 2
    scored: false
    elevated: true
    audit:
      command: |
        pending=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate RecommendedUpdates 2>/dev/null | grep -c "Display Name")
        if [ "$pending" -eq 0 ]; then
          echo "PASS: no pending updates recorded at the last check"
        else
          echo "FAIL: $pending update(s) waiting to be installed"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > Software Update → install everything listed, then restart."
    frameworks: ["cis", "essentials"]

  - id: "P2.7"
    title: "Installed apps are up to date"
    description: "Third-party apps and their plugins are patched on their own schedule — Homebrew is the most common way to keep them current on macOS."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
        export PATH
        if ! command -v brew >/dev/null 2>&1; then
          echo "UNKNOWN: Homebrew is not installed — check app updates manually or via the App Store"
        else
          outdated=$(brew outdated --quiet 2>/dev/null | wc -l | tr -d ' ')
          if [ "$outdated" = "0" ]; then
            echo "PASS: all Homebrew packages are current"
          else
            echo "FAIL: $outdated Homebrew package(s) are outdated"
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Run: brew update && brew upgrade. Also check the App Store's Updates tab and each app's built-in updater."
    frameworks: ["cis", "essentials"]

  - id: "P2.8"
    title: "Endpoint protection is active"
    description: "Reports what is actually defending this Mac against malware — Apple's built-in XProtect, a third-party agent, or both."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        agents=$(ls /Applications 2>/dev/null | grep -iE "crowdstrike|sentinelone|sophos|malwarebytes|bitdefender|eset|norton|mcafee|avast|avg|kaspersky|trend micro|webroot|intego|objective-see|lulu|blockblock" | tr '\n' ' ')
        xprotect="no"
        [ -d "/Library/Apple/System/Library/CoreServices/XProtect.app" ] && xprotect="yes"
        [ -d "/Library/Apple/System/Library/CoreServices/XProtect.bundle" ] && xprotect="yes"
        if [ -n "$agents" ]; then
          echo "PASS: third-party endpoint protection installed:$agents (XProtect present: $xprotect)"
        elif [ "$xprotect" = "yes" ]; then
          echo "PASS: relying on built-in protection (XProtect and Gatekeeper), no third-party agent installed"
        else
          echo "FAIL: no endpoint protection detected"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "For most personal Macs XProtect plus Gatekeeper is enough. Add a reputable third-party agent if you handle work data or download software from outside the App Store."
    frameworks: ["cis", "essentials", "soc"]

  - id: "P2.9"
    title: "Mounted external volumes are encrypted"
    description: "An unencrypted backup or scratch disk hands over every file on it if the drive is lost, and makes secure disposal impossible."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        unencrypted=""
        for volume in /Volumes/*; do
          [ -d "$volume" ] || continue
          info=$(diskutil info "$volume" 2>/dev/null)
          [ -n "$info" ] || continue
          echo "$info" | grep -qiE "Internal:[[:space:]]*Yes" && continue
          echo "$info" | grep -qiE "Read-Only Media:[[:space:]]*Yes" && continue
          if echo "$info" | grep -qiE "FileVault:[[:space:]]*Yes|Encrypted:[[:space:]]*Yes"; then
            continue
          fi
          unencrypted="$unencrypted $(basename "$volume")"
        done
        if [ -z "$unencrypted" ]; then
          echo "PASS: no unencrypted external volumes are mounted"
        else
          echo "FAIL: unencrypted external volume(s) mounted:$unencrypted"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Right-click the volume in Finder > Encrypt, or reformat it as APFS (Encrypted) in Disk Utility. Erase old drives with Disk Utility before disposing of them."
    frameworks: ["cis", "iso", "nist-csf"]

  - id: "P2.10"
    title: "Local snapshots are available for rollback"
    description: "Time Machine local snapshots let you roll the whole system back to a point before files were encrypted or corrupted."
    category: "data_protection"
    level: 2
    scored: false
    audit:
      command: |
        snapshots=$(tmutil listlocalsnapshots / 2>/dev/null | grep -c "com.apple.TimeMachine")
        if [ "$snapshots" -gt 0 ]; then
          echo "PASS: $snapshots local snapshot(s) available for rollback"
        else
          echo "WARNING: no local snapshots found — recovery would depend entirely on external backups"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Configure a Time Machine destination — macOS then keeps hourly local snapshots automatically. Snapshots are not a substitute for an off-device backup."
    frameworks: ["iso", "nist-csf"]

  # ──────────────────────────────────────────────
  # Online Safety
  # ──────────────────────────────────────────────

  - id: "P3.1"
    title: "Safari warns about fraudulent websites"
    description: "Safari's fraudulent-site warning blocks known phishing and scam pages before they load."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        value=$(defaults read com.apple.Safari WarnAboutFraudulentWebsites 2>/dev/null)
        if [ -z "$value" ]; then
          container="$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari"
          value=$(defaults read "$container" WarnAboutFraudulentWebsites 2>/dev/null)
        fi
        if [ "$value" = "1" ]; then
          echo "PASS: fraudulent website warning is on"
        elif [ -z "$value" ]; then
          echo "UNKNOWN: Safari preferences are not readable (grant Full Disk Access to your terminal, or verify in Safari > Settings > Security)"
        else
          echo "FAIL: fraudulent website warning is off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > Security → enable 'Warn when visiting a fraudulent website'."
    frameworks: ["nist-csf", "essentials"]

  - id: "P3.2"
    title: "Safari does not auto-open downloads"
    description: "Auto-opening 'safe' downloads lets a malicious archive or disk image run its payload the moment it lands."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        value=$(defaults read com.apple.Safari AutoOpenSafeDownloads 2>/dev/null)
        if [ -z "$value" ]; then
          container="$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari"
          value=$(defaults read "$container" AutoOpenSafeDownloads 2>/dev/null)
        fi
        if [ "$value" = "0" ]; then
          echo "PASS: downloads are not opened automatically"
        elif [ -z "$value" ]; then
          echo "UNKNOWN: Safari preferences are not readable (verify in Safari > Settings > General)"
        else
          echo "FAIL: Safari opens 'safe' downloads automatically"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Safari > Settings > General → uncheck 'Open \"safe\" files after downloading'."
    frameworks: ["cis", "essentials"]

  - id: "P3.3"
    title: "Chrome Safe Browsing is on"
    description: "Safe Browsing blocks known phishing, scam, and malware sites in Chrome."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        if [ ! -d "/Applications/Google Chrome.app" ]; then
          echo "PASS: Google Chrome is not installed"
        else
          prefs="$HOME/Library/Application Support/Google/Chrome/Default/Preferences"
          if [ ! -f "$prefs" ]; then
            echo "UNKNOWN: Chrome profile not found — verify at chrome://settings/security"
          elif grep -o '"safebrowsing":{[^}]*}' "$prefs" 2>/dev/null | grep -q '"enabled":true'; then
            echo "PASS: Chrome Safe Browsing is enabled"
          else
            echo "FAIL: Chrome Safe Browsing appears to be off"
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Chrome > Settings > Privacy and security > Security → choose Enhanced or Standard protection."
    frameworks: ["nist-csf", "essentials"]

  - id: "P3.4"
    title: "Ad and tracker blocking is in place"
    description: "Most consumer malware and scams arrive through malicious ads and tracking scripts. Blocking them removes a whole delivery channel."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        blockers=$(ls /Applications "$HOME/Applications" 2>/dev/null | grep -iE "adguard|1blocker|wipr|ghostery|ublock|stopthemadness|adblock|privacy badger|little snitch" | tr '\n' ' ')
        if [ -n "$blockers" ]; then
          echo "PASS: content blocking tool(s) installed:$blockers"
        else
          echo "WARNING: no ad or tracker blocker detected (browser extensions are not visible to this check)"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install a content blocker (AdGuard, 1Blocker, uBlock Origin) or use a filtering DNS resolver so every app on the Mac benefits."
    frameworks: ["nist-csf"]

  - id: "P3.5"
    title: "A filtering DNS resolver is configured"
    description: "A filtering resolver blocks malware, phishing, and tracker domains for every app on the Mac, not just the browser."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        servers=$(scutil --dns 2>/dev/null | awk '/nameserver\[/{print $3}' | sort -u | tr '\n' ' ')
        if [ -z "$servers" ]; then
          echo "UNKNOWN: no DNS resolvers reported (not connected to a network?)"
        elif echo "$servers" | grep -qE "9\.9\.9\.9|149\.112\.112|1\.1\.1\.2|1\.0\.0\.2|208\.67\.22|94\.140\.14|94\.140\.15|185\.228\.168|76\.76\.2\.|45\.90\.28|45\.90\.30"; then
          echo "PASS: filtering DNS resolver in use ($servers)"
        else
          echo "WARNING: resolvers in use are $servers — no known filtering or encrypted DNS provider detected"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Point DNS at a filtering resolver (Quad9 9.9.9.9, Cloudflare for Families 1.1.1.2, AdGuard DNS, or NextDNS), ideally via an encrypted-DNS profile so it applies on every network."
    frameworks: ["nist-csf", "essentials"]

  - id: "P3.6"
    title: "A VPN is configured"
    description: "A VPN protects traffic on public and untrusted Wi-Fi, where anyone on the same network can watch unencrypted connections."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        services=$(scutil --nc list 2>/dev/null | grep -cE "^[*[:space:]]*\(")
        apps=$(ls /Applications 2>/dev/null | grep -iE "nordvpn|proton vpn|protonvpn|mullvad|expressvpn|surfshark|tailscale|wireguard|tunnelblick|windscribe|ivpn|viscosity|warp|openvpn" | tr '\n' ' ')
        if [ "$services" -gt 0 ] || [ -n "$apps" ]; then
          echo "PASS: VPN configured ($services system VPN service(s), apps:$apps)"
        else
          echo "WARNING: no VPN configuration or client found"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install a no-logs VPN client, or use iCloud Private Relay, and turn it on automatically when joining untrusted Wi-Fi."
    frameworks: ["iso", "nist-csf"]

  - id: "P3.7"
    title: "Remembered Wi-Fi network list is small"
    description: "Every remembered network is one your Mac will re-join automatically. A long list makes it easy for an attacker to impersonate a network you once used."
    category: "online_safety"
    level: 2
    scored: false
    elevated: true
    audit:
      command: |
        known=$(defaults read /Library/Preferences/com.apple.wifi.known-networks 2>/dev/null | grep -c "SSIDString")
        if [ "$known" -eq 0 ]; then
          known=$(defaults read /Library/Preferences/SystemConfiguration/com.apple.airport.preferences 2>/dev/null | grep -c "SSIDString")
        fi
        if [ "$known" -eq 0 ]; then
          echo "UNKNOWN: could not read the remembered network list"
        elif [ "$known" -le 20 ]; then
          echo "PASS: $known remembered Wi-Fi network(s)"
        else
          echo "FAIL: $known remembered Wi-Fi networks — prune the ones you no longer use"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Wi-Fi > Advanced → remove networks you no longer use, especially hotels, airports, and cafés, and turn off auto-join for public networks."
    frameworks: ["iso", "essentials"]

  # ──────────────────────────────────────────────
  # Home & Network Protection
  # ──────────────────────────────────────────────

  - id: "P4.1"
    title: "Router has no legacy admin services open"
    description: "Telnet and FTP on a home router are unauthenticated or cleartext, and are a common way routers get taken over."
    category: "network_protection"
    level: 2
    scored: false
    audit:
      command: |
        gateway=$(route -n get default 2>/dev/null | awk '/gateway:/{print $2}')
        if [ -z "$gateway" ]; then
          echo "UNKNOWN: no default gateway found (not connected to a network)"
        else
          open=""
          for port in 21 23 2323; do
            if nc -z -w 1 "$gateway" "$port" >/dev/null 2>&1; then
              open="$open $port"
            fi
          done
          if [ -z "$open" ]; then
            echo "PASS: no legacy admin services reachable on the router ($gateway)"
          else
            echo "FAIL: legacy service(s) open on the router ($gateway): port$open"
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Log in to the router's admin page and disable Telnet, FTP, and remote/WAN administration. Change the default admin password and update the firmware."
    frameworks: ["cis", "iso", "essentials"]

  - id: "P4.2"
    title: "Home network device inventory"
    description: "Lists the devices your Mac can currently see on the local network, so unfamiliar ones stand out."
    category: "network_protection"
    level: 1
    scored: false
    audit:
      command: |
        gateway=$(route -n get default 2>/dev/null | awk '/gateway:/{print $2}')
        devices=$(arp -a -n 2>/dev/null | grep " at " | wc -l | tr -d ' ')
        list=$(arp -a -n 2>/dev/null | awk '{print $2}' | tr -d '()' | head -20 | tr '\n' ' ')
        if [ "$devices" = "0" ]; then
          echo "UNKNOWN: no neighbours in the ARP cache (not connected to a local network?)"
        else
          echo "PASS: $devices device(s) seen on the local network (gateway ${gateway:-unknown}): $list"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Review the list against the devices you own. Put smart TVs, cameras, and speakers on a guest or IoT network so they cannot reach your computers."
    frameworks: ["cis", "iso"]

  - id: "P4.3"
    title: "No unexpected services listening on the network"
    description: "Anything listening on a non-loopback address is reachable by every other device on the network, including compromised IoT devices."
    category: "network_protection"
    level: 1
    scored: false
    elevated: true
    audit:
      command: |
        listeners=$(lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null | awk 'NR > 1 {print $1 " " $9}' | grep -v "127\.0\.0\.1" | grep -v "\[::1\]" | sort -u | tr '\n' ';')
        if [ -z "$listeners" ]; then
          echo "PASS: nothing is listening on a network-facing address"
        else
          echo "FAIL: network-facing listeners: $listeners"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Identify each process and quit or uninstall what you do not need. Turn off unused services in System Settings > General > Sharing, and enable the firewall's stealth mode."
    frameworks: ["cis", "iso", "essentials"]

  - id: "P4.4"
    title: "No unexpected web proxy is configured"
    description: "A proxy silently inserted into your network settings can read and modify traffic — a common trait of adware and MITM tooling."
    category: "network_protection"
    level: 2
    scored: false
    audit:
      command: |
        enabled=$(networksetup -listallnetworkservices 2>/dev/null | tail -n +2 | sed 's/^\*//' | while IFS= read -r service; do
          [ -n "$service" ] || continue
          for kind in getwebproxy getsecurewebproxy getautoproxyurl; do
            if networksetup "-$kind" "$service" 2>/dev/null | grep -qE "^Enabled: Yes"; then
              printf '%s(%s) ' "$service" "$kind"
            fi
          done
        done)
        if [ -z "$enabled" ]; then
          echo "PASS: no web proxy is enabled on any network service"
        else
          echo "FAIL: proxy enabled — $enabled"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Network > [your connection] > Details > Proxies → turn off any proxy you did not configure yourself, then scan for adware."
    frameworks: ["cis", "nist-csf"]

  # ──────────────────────────────────────────────
  # Privacy & Personal Safety
  # ──────────────────────────────────────────────

  - id: "P5.1"
    title: "Personalized ads are off"
    description: "Apple's personalized advertising builds a profile from your App Store, Apple News, and Stocks activity."
    category: "privacy"
    level: 1
    scored: false
    audit:
      command: |
        value=$(defaults read com.apple.AdLib allowApplePersonalizedAdvertising 2>/dev/null)
        if [ "$value" = "0" ]; then
          echo "PASS: personalized ads are disabled"
        elif [ -z "$value" ]; then
          echo "WARNING: personalized ads are not explicitly disabled (system default applies)"
        else
          echo "FAIL: personalized ads are enabled"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Apple Advertising → turn off 'Personalized Ads'."
    frameworks: ["iso", "soc"]

  - id: "P5.2"
    title: "Analytics sharing with Apple is off"
    description: "Diagnostic submissions can contain fragments of documents, URLs, and crash data from the apps you use."
    category: "privacy"
    level: 1
    scored: true
    elevated: true
    audit:
      command: |
        value=$(defaults read "/Library/Application Support/CrashReporter/DiagnosticMessagesHistory" AutoSubmit 2>/dev/null)
        if [ "$value" = "1" ]; then
          echo "FAIL: diagnostics and usage data are shared automatically"
        else
          echo "PASS: automatic analytics sharing is off"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Analytics & Improvements → turn off 'Share Mac Analytics' and 'Share with App Developers'."
    frameworks: ["iso", "soc"]

  - id: "P5.3"
    title: "Siri and Dictation data sharing is off"
    description: "Opting in sends audio recordings and transcripts of your requests to Apple for review."
    category: "privacy"
    level: 2
    scored: false
    audit:
      command: |
        value=$(defaults read com.apple.assistant.support "Siri Data Sharing Opt-In Status" 2>/dev/null)
        if [ "$value" = "2" ]; then
          echo "PASS: Siri audio sharing is opted out"
        elif [ "$value" = "1" ]; then
          echo "FAIL: Siri audio recordings are shared with Apple"
        else
          echo "WARNING: Siri sharing preference is not set (status ${value:-unset})"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Analytics & Improvements → turn off 'Improve Siri & Dictation', and delete history under Siri & Spotlight."
    frameworks: ["iso", "soc"]

  - id: "P5.4"
    title: "Location Services state is known"
    description: "Location is what makes Find My work, and also what lets apps build a movement history. This check reports which trade-off is in effect."
    category: "privacy"
    level: 2
    scored: false
    elevated: true
    audit:
      command: |
        plist=$(ls /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd.*.plist 2>/dev/null | head -1)
        if [ -z "$plist" ]; then
          echo "UNKNOWN: could not read the Location Services preference"
        else
          value=$(defaults read "${plist%.plist}" LocationServicesEnabled 2>/dev/null)
          if [ "$value" = "1" ]; then
            echo "PASS: Location Services is on — review per-app access, and keep it on for Find My"
          else
            echo "PASS: Location Services is off — Find My will not be able to locate this Mac"
          fi
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > Privacy & Security > Location Services → review which apps have access and revoke the ones that do not need it. Leave System Services > Find My enabled."
    frameworks: ["iso"]

  - id: "P5.5"
    title: "Computer name does not reveal your identity"
    description: "The computer name is broadcast over AirDrop, Bonjour, and every network you join — including public Wi-Fi."
    category: "privacy"
    level: 1
    scored: false
    audit:
      command: |
        name=$(scutil --get ComputerName 2>/dev/null)
        if [ -z "$name" ]; then
          echo "UNKNOWN: could not read the computer name"
        elif echo "$name" | grep -qE "'s |’s "; then
          echo "FAIL: the broadcast name \"$name\" contains a personal name"
        else
          echo "PASS: computer name is \"$name\""
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "System Settings > General > About → rename the Mac to something impersonal, and update the local hostname to match."
    frameworks: ["iso"]

  - id: "P5.6"
    title: "Encrypted messaging is available"
    description: "End-to-end encrypted messaging keeps conversations and shared files private in transit and on the provider's servers."
    category: "privacy"
    level: 2
    scored: false
    audit:
      command: |
        apps=$(ls /Applications "$HOME/Applications" 2>/dev/null | grep -iE "signal|wire|element|session|threema|keybase|proton mail|protonmail|wickr|olvid|briar" | tr '\n' ' ')
        if [ -n "$apps" ]; then
          echo "PASS: encrypted messaging app(s) installed:$apps"
        elif [ -d "/System/Applications/Messages.app" ]; then
          echo "PASS: Messages is available (iMessage is end-to-end encrypted; SMS fallback is not)"
        else
          echo "WARNING: no encrypted messaging app found"
        fi
      match:
        type: "contains"
        value: "PASS"
    remediation: "Install Signal for sensitive conversations, and prefer end-to-end encrypted file transfer over email attachments."
    frameworks: ["iso", "nist-csf"]
