name: "Armazi Personal Protection Benchmark"
version: "1.0.0"
platform: "macOS"
description: "Consumer security posture benchmark — identity, devices, data, online safety, home network, privacy, and incident readiness. Checks report ARMAZI_PASS, ARMAZI_FAIL, or ARMAZI_REVIEW. Items that cannot be verified from the machine are attested by the user in ~/.config/armazi/attested.txt."

checks:
  # ──────────────────────────────────────────────
  # Identity & Account Protection
  # ──────────────────────────────────────────────

  - id: "ID.1"
    title: "A password manager is in use"
    description: "Store credentials in a dedicated password manager or iCloud Keychain instead of reusing passwords."
    category: "identity_protection"
    level: 1
    scored: true
    audit:
      command: |
        found=""
        for app in "1Password" "1Password 7 - Password Manager" "Bitwarden" "Dashlane" "Enpass" "KeePassXC" "Keeper Password Manager" "LastPass" "NordPass" "Proton Pass" "Secrets" "Strongbox"; do
          if [ -d "/Applications/$app.app" ] || [ -d "$HOME/Applications/$app.app" ]; then
            found="$found $app"
          fi
        done
        icloud_service() {
          defaults read MobileMeAccounts 2>/dev/null | awk -v want="$1" '
            /^[[:space:]]*\{/ { on = 0; nm = "" }
            /Enabled = 1;/ { on = 1 }
            /Name = / { line = $0; gsub(/[";]/, "", line); sub(/^[^=]*= */, "", line); nm = line }
            /^[[:space:]]*\}/ { if (nm == want && on == 1) f = 1 }
            END { exit (f ? 0 : 1) }'
        }
        if [ -n "$found" ]; then
          echo "ARMAZI_PASS: manager installed —$found"
        elif icloud_service "KEYCHAIN_SYNC"; then
          echo "ARMAZI_PASS: iCloud Keychain is enabled"
        else
          echo "ARMAZI_FAIL: no credential manager detected"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Install a password manager (1Password, Bitwarden, KeePassXC, Proton Pass) or turn on System Settings > [your name] > iCloud > Passwords & Keychain."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "ID.2"
    title: "A multi-factor authentication app is installed"
    description: "Keep one-time codes in a dedicated authenticator rather than SMS, which is vulnerable to SIM-swap attacks."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        found=""
        for app in "Raivo OTP" "2FAS" "Authy" "Ente Auth" "Step Two" "OTP Auth" "Tofu" "Okta Verify" "Duo Mobile" "Microsoft Authenticator" "1Password" "Bitwarden" "Proton Pass" "Keeper Password Manager"; do
          if [ -d "/Applications/$app.app" ] || [ -d "$HOME/Applications/$app.app" ]; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "ARMAZI_PASS: authenticator available —$found"
        else
          echo "ARMAZI_REVIEW: no authenticator app found on this Mac (it may live only on your phone)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Install an authenticator app (Ente Auth, 2FAS, Raivo, or the TOTP feature of your password manager) and move SMS-based codes over to it."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "ID.3"
    title: "Apple Account uses two-factor authentication"
    description: "Two-factor authentication protects the account that can reset your Mac, your backups, and Find My."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        id="ID.3"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        elif defaults read MobileMeAccounts 2>/dev/null | grep -q "AccountID"; then
          echo "ARMAZI_REVIEW: signed in to iCloud — confirm two-factor is on, then run: echo $id >> $att"
        else
          echo "ARMAZI_REVIEW: no iCloud account detected — confirm two-factor on the Apple Account you use"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > [your name] > Sign-In & Security > Two-Factor Authentication. Then record it: mkdir -p ~/.config/armazi && echo ID.3 >> ~/.config/armazi/attested.txt"
    frameworks: ["cis", "nist-csf", "essentials", "soc"]

  - id: "ID.4"
    title: "A hardware security key is registered"
    description: "Phishing-resistant MFA (a FIDO2 key or passkey) stops credential theft that one-time codes cannot."
    category: "identity_protection"
    level: 2
    scored: false
    audit:
      command: |
        id="ID.4"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: register a security key or passkey on your most valuable accounts, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Register a FIDO2 key (YubiKey, Titan) or a passkey on your email, bank, and Apple Account. Then: echo ID.4 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf", "soc"]

  - id: "ID.5"
    title: "Guest account is disabled"
    description: "A guest login is an unauthenticated door into the machine."
    category: "identity_protection"
    level: 1
    scored: true
    audit:
      command: |
        v=$(defaults read /Library/Preferences/com.apple.loginwindow GuestEnabled 2>/dev/null)
        if [ -z "$v" ] || [ "$v" = "0" ]; then
          echo "ARMAZI_PASS: guest login is off"
        else
          echo "ARMAZI_FAIL: guest login is enabled"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Users & Groups > Guest User → turn off. Or: sudo defaults write /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false"
    frameworks: ["cis", "iso", "essentials"]

  - id: "ID.6"
    title: "The screen locks and asks for a password quickly"
    description: "An unlocked, unattended Mac hands over every account you are signed in to."
    category: "identity_protection"
    level: 1
    scored: true
    audit:
      command: |
        out=$(sysadminctl -screenLock status 2>&1)
        if echo "$out" | grep -qi "screenLock is off"; then
          echo "ARMAZI_FAIL: no password is required after the screen locks"
        elif echo "$out" | grep -qi "immediate"; then
          echo "ARMAZI_PASS: password required immediately"
        else
          secs=$(echo "$out" | sed -n 's/.*delay is \([0-9][0-9]*\) seconds.*/\1/p')
          if [ -n "$secs" ] && [ "$secs" -le 60 ]; then
            echo "ARMAZI_PASS: password required after $secs second(s)"
          elif [ -n "$secs" ]; then
            echo "ARMAZI_FAIL: password only required after $secs seconds"
          else
            echo "ARMAZI_REVIEW: could not read the screen lock setting"
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Lock Screen > Require password after screen saver begins → Immediately (or 1 minute)."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "ID.7"
    title: "The login window hides the user list"
    description: "Showing name and password fields instead of account icons keeps usernames off the lock screen."
    category: "identity_protection"
    level: 2
    scored: false
    audit:
      command: |
        v=$(defaults read /Library/Preferences/com.apple.loginwindow SHOWFULLNAME 2>/dev/null)
        if [ "$v" = "1" ]; then
          echo "ARMAZI_PASS: login window asks for a name and password"
        else
          echo "ARMAZI_FAIL: the login window lists local accounts"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "sudo defaults write /Library/Preferences/com.apple.loginwindow SHOWFULLNAME -bool true"
    frameworks: ["cis", "iso"]

  - id: "ID.8"
    title: "Breach and dark web monitoring is active"
    description: "Continuous monitoring of your email addresses, phone numbers, and card numbers tells you when a service you use is breached."
    category: "identity_protection"
    level: 1
    scored: false
    audit:
      command: |
        id="ID.8"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: enrol your addresses in breach monitoring, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Subscribe to breach monitoring (Have I Been Pwned notifications, or the monitoring built into your password manager) for every address you use. Then: echo ID.8 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf", "iso"]

  - id: "ID.9"
    title: "Fraud and credit monitoring is in place"
    description: "Credit and account monitoring surfaces accounts opened in your name."
    category: "identity_protection"
    level: 2
    scored: false
    audit:
      command: |
        id="ID.9"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: enable bank alerts and credit monitoring where your jurisdiction allows, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Turn on transaction alerts with your bank and enrol in credit monitoring or a credit freeze if available in your country. Then: echo ID.9 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf"]

  - id: "ID.10"
    title: "SIM-swap protection is set with your carrier"
    description: "A port-out PIN stops an attacker moving your number and intercepting SMS codes."
    category: "identity_protection"
    level: 2
    scored: false
    audit:
      command: |
        id="ID.10"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: set a port-out PIN with your mobile carrier, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Ask your mobile carrier for a port-out or transfer PIN and remove SMS as a recovery method where you can. Then: echo ID.10 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf"]

  # ──────────────────────────────────────────────
  # Device & Data Security
  # ──────────────────────────────────────────────

  - id: "DV.1"
    title: "FileVault disk encryption is on"
    description: "Without FileVault, anyone holding the machine can read every file on it."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        out=$(fdesetup status 2>&1)
        if echo "$out" | grep -qi "FileVault is On"; then
          echo "ARMAZI_PASS: FileVault is on"
        elif echo "$out" | grep -qi "FileVault is Off"; then
          echo "ARMAZI_FAIL: FileVault is off"
        else
          echo "ARMAZI_REVIEW: could not read the FileVault state ($out)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Privacy & Security > FileVault → Turn On. Store the recovery key in your password manager."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "DV.2"
    title: "A backup destination is configured"
    description: "Ransomware and hardware failure are both survivable only with a backup."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        dest=$(tmutil destinationinfo 2>&1)
        if echo "$dest" | grep -qi "No destinations"; then
          echo "ARMAZI_FAIL: Time Machine has no backup destination"
        elif echo "$dest" | grep -qi "Name"; then
          echo "ARMAZI_PASS: backup destination configured"
        else
          echo "ARMAZI_REVIEW: could not read Time Machine destinations ($dest)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > General > Time Machine > Add Backup Disk. Keep one copy off-site or in the cloud."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "DV.3"
    title: "Backups are encrypted"
    description: "An unencrypted backup disk is a full copy of your data that anyone can read."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        dest=$(tmutil destinationinfo 2>&1)
        if echo "$dest" | grep -qi "No destinations"; then
          echo "ARMAZI_FAIL: no backup destination to encrypt"
        elif echo "$dest" | grep -qi "encrypted.*yes\|Encryption Status.*Encrypted"; then
          echo "ARMAZI_PASS: backups are encrypted"
        elif echo "$dest" | grep -qi "Name"; then
          echo "ARMAZI_FAIL: the backup destination is not encrypted"
        else
          echo "ARMAZI_REVIEW: could not read Time Machine destinations ($dest)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > General > Time Machine > select the disk > Encrypt Backups. Existing unencrypted backups must be re-created."
    frameworks: ["cis", "iso", "nist-csf", "soc"]

  - id: "DV.4"
    title: "The last backup completed recently"
    description: "A backup that stopped running months ago will not recover today's files."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        latest=$(tmutil latestbackup 2>/dev/null | tail -1)
        if [ -z "$latest" ]; then
          echo "ARMAZI_REVIEW: no completed backup found (Time Machine may need Full Disk Access to report)"
        else
          stamp=$(basename "$latest" | sed 's/\.backup$//' | cut -c1-19)
          ts=$(date -j -f "%Y-%m-%d-%H%M%S" "$stamp" "+%s" 2>/dev/null)
          if [ -z "$ts" ]; then
            echo "ARMAZI_REVIEW: found a backup but could not read its date ($latest)"
          else
            days=$(( ( $(date "+%s") - ts ) / 86400 ))
            if [ "$days" -le 7 ]; then
              echo "ARMAZI_PASS: last backup was $days day(s) ago"
            else
              echo "ARMAZI_FAIL: last backup was $days day(s) ago"
            fi
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Reconnect the backup disk and let Time Machine finish, or enable 'Back Up Automatically'."
    frameworks: ["iso", "nist-csf", "soc"]

  - id: "DV.5"
    title: "Local snapshots are available for rollback"
    description: "APFS snapshots let you roll back files that ransomware or a bad update has damaged."
    category: "device_data"
    level: 1
    scored: false
    audit:
      command: |
        n=$(tmutil listlocalsnapshots / 2>/dev/null | grep -c "com.apple.TimeMachine")
        if [ "$n" -gt 0 ]; then
          echo "ARMAZI_PASS: $n local snapshot(s) available"
        else
          echo "ARMAZI_REVIEW: no local snapshots — turn Time Machine on so macOS keeps hourly snapshots"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Enable Time Machine; macOS then keeps 24 hours of local APFS snapshots you can restore from without the backup disk attached."
    frameworks: ["nist-csf", "soc"]

  - id: "DV.6"
    title: "Find My Mac is enabled"
    description: "Find My is what lets you locate, lock, or remotely erase a stolen Mac."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        out=$(nvram -p 2>/dev/null)
        if [ -z "$out" ]; then
          echo "ARMAZI_REVIEW: could not read NVRAM to confirm Find My"
        elif echo "$out" | grep -q "fmm-mobileme-token-FMM"; then
          echo "ARMAZI_PASS: Find My Mac is enabled"
        else
          echo "ARMAZI_FAIL: Find My Mac is off"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > [your name] > iCloud > Find My Mac → turn on, including 'Find My network'."
    frameworks: ["iso", "nist-csf", "essentials"]

  - id: "DV.7"
    title: "Versioned cloud storage is in use"
    description: "Cloud storage with file versioning recovers documents that were corrupted, encrypted, or deleted."
    category: "device_data"
    level: 1
    scored: false
    audit:
      command: |
        icloud_service() {
          defaults read MobileMeAccounts 2>/dev/null | awk -v want="$1" '
            /^[[:space:]]*\{/ { on = 0; nm = "" }
            /Enabled = 1;/ { on = 1 }
            /Name = / { line = $0; gsub(/[";]/, "", line); sub(/^[^=]*= */, "", line); nm = line }
            /^[[:space:]]*\}/ { if (nm == want && on == 1) f = 1 }
            END { exit (f ? 0 : 1) }'
        }
        found=""
        for d in "$HOME/Library/Mobile Documents/com~apple~CloudDocs" "$HOME/Dropbox" "$HOME/OneDrive" "$HOME/Google Drive" "$HOME/Library/CloudStorage"; do
          [ -d "$d" ] && found="$found $(basename "$d")"
        done
        if icloud_service "MOBILE_DOCUMENTS"; then
          echo "ARMAZI_PASS: iCloud Drive is enabled"
        elif [ -n "$found" ]; then
          echo "ARMAZI_PASS: cloud storage present —$found"
        else
          echo "ARMAZI_REVIEW: no versioned cloud storage detected"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Turn on iCloud Drive (System Settings > [your name] > iCloud) or another provider that keeps file versions, and store working documents there."
    frameworks: ["iso", "nist-csf"]

  - id: "DV.8"
    title: "Security updates install automatically"
    description: "Most compromises use a patched bug. Automatic security responses and system data files close them without you acting."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        p="/Library/Preferences/com.apple.SoftwareUpdate"
        cfg=$(defaults read "$p" ConfigDataInstall 2>/dev/null)
        crit=$(defaults read "$p" CriticalUpdateInstall 2>/dev/null)
        auto=$(defaults read "$p" AutomaticCheckEnabled 2>/dev/null)
        missing=""
        [ "$auto" = "1" ] || missing="$missing automatic-check"
        [ "$cfg" = "1" ] || missing="$missing system-data-files"
        [ "$crit" = "1" ] || missing="$missing security-responses"
        if [ -z "$missing" ]; then
          echo "ARMAZI_PASS: automatic security updates are on"
        else
          echo "ARMAZI_FAIL: disabled —$missing"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > General > Software Update > (i) → enable 'Install Security Responses and System Files' and 'Check for updates'."
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "DV.9"
    title: "Malware definitions are current"
    description: "XProtect is the malware scanner built into macOS; stale definitions miss recent families."
    category: "device_data"
    level: 1
    scored: true
    audit:
      command: |
        b="/Library/Apple/System/Library/CoreServices/XProtect.bundle"
        f="$b/Contents/Resources/XProtect.yara"
        [ -f "$f" ] || f="$b/Contents/Info.plist"
        if [ ! -f "$f" ]; then
          echo "ARMAZI_REVIEW: XProtect bundle not found at the expected path"
        else
          m=$(stat -f %m "$f" 2>/dev/null)
          if [ -z "$m" ]; then
            echo "ARMAZI_REVIEW: could not read the XProtect definition date"
          else
            days=$(( ( $(date "+%s") - m ) / 86400 ))
            if [ "$days" -le 60 ]; then
              echo "ARMAZI_PASS: definitions updated $days day(s) ago"
            else
              echo "ARMAZI_FAIL: definitions are $days day(s) old"
            fi
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Run: sudo softwareupdate --background-critical-update-install, and keep 'Install Security Responses and System Files' enabled."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "DV.10"
    title: "Applications are up to date"
    description: "Third-party apps and plug-ins are patched far less often than the OS, and are a common way in."
    category: "device_data"
    level: 1
    scored: false
    audit:
      command: |
        store=$(defaults read /Library/Preferences/com.apple.commerce AutoUpdate 2>/dev/null)
        if command -v brew >/dev/null 2>&1; then
          n=$(HOMEBREW_NO_AUTO_UPDATE=1 brew outdated --quiet 2>/dev/null | grep -c .)
          if [ "$n" -eq 0 ]; then
            echo "ARMAZI_PASS: no outdated Homebrew packages (App Store auto-update: ${store:-unset})"
          else
            echo "ARMAZI_FAIL: $n outdated Homebrew package(s)"
          fi
        elif [ "$store" = "1" ]; then
          echo "ARMAZI_PASS: App Store apps update automatically"
        else
          echo "ARMAZI_REVIEW: no package manager found and App Store auto-update is off"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Run 'brew upgrade' for Homebrew packages and enable System Settings > General > Software Update > Install application updates from the App Store."
    frameworks: ["cis", "iso", "essentials"]

  - id: "DV.11"
    title: "An endpoint protection agent is installed"
    description: "A managed antivirus or EDR agent adds detection and response on top of the protections built into macOS."
    category: "device_data"
    level: 2
    scored: false
    audit:
      command: |
        found=""
        for app in "Falcon" "SentinelOne" "Sophos Endpoint" "Microsoft Defender" "Malwarebytes" "ESET Endpoint Security" "Bitdefender" "CrowdStrike Falcon" "Huntress"; do
          if [ -d "/Applications/$app.app" ] || [ -d "/Library/Application Support/$app" ]; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "ARMAZI_PASS: endpoint agent present —$found"
        else
          echo "ARMAZI_REVIEW: no third-party endpoint agent found — XProtect and Gatekeeper are the only layers in place"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Install a reputable endpoint protection product if your risk profile or employer requires one; otherwise keep XProtect, Gatekeeper, and FileVault on."
    frameworks: ["cis", "essentials", "soc"]

  - id: "DV.12"
    title: "Retired devices were securely wiped"
    description: "Old laptops, phones, and disks carry credentials and documents unless they were erased."
    category: "device_data"
    level: 2
    scored: false
    audit:
      command: |
        id="DV.12"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: erase devices before disposal or resale, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Use System Settings > General > Transfer or Reset > Erase All Content and Settings before disposal; for external disks use 'diskutil secureErase'. Then: echo DV.12 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "soc"]

  # ──────────────────────────────────────────────
  # Online Safety
  # ──────────────────────────────────────────────

  - id: "ON.1"
    title: "Gatekeeper is enabled"
    description: "Gatekeeper blocks applications that are not signed and notarized by a known developer."
    category: "online_safety"
    level: 1
    scored: true
    audit:
      command: |
        out=$(spctl --status 2>&1)
        if echo "$out" | grep -qi "assessments enabled"; then
          echo "ARMAZI_PASS: Gatekeeper is on"
        elif echo "$out" | grep -qi "assessments disabled"; then
          echo "ARMAZI_FAIL: Gatekeeper is disabled"
        else
          echo "ARMAZI_REVIEW: could not read the Gatekeeper state ($out)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "sudo spctl --master-enable, then System Settings > Privacy & Security > Allow applications from App Store and identified developers."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "ON.2"
    title: "The browser warns about fraudulent sites"
    description: "Phishing pages are the most common way accounts are stolen; the browser can flag known ones."
    category: "online_safety"
    level: 1
    scored: true
    audit:
      command: |
        v=$(defaults read com.apple.Safari WarnAboutFraudulentWebsites 2>/dev/null)
        if [ "$v" = "1" ]; then
          echo "ARMAZI_PASS: fraudulent site warnings are on"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: Safari settings are not readable — grant Full Disk Access to your terminal, or check Safari > Settings > Security"
        else
          echo "ARMAZI_FAIL: fraudulent site warnings are off"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Safari > Settings > Security > 'Warn when visiting a fraudulent website'. In Chrome or Firefox turn on Enhanced Safe Browsing."
    frameworks: ["cis", "nist-csf", "essentials"]

  - id: "ON.3"
    title: "Downloads do not open automatically"
    description: "Auto-opening downloads lets a malicious file run before you have looked at it."
    category: "online_safety"
    level: 1
    scored: true
    audit:
      command: |
        v=$(defaults read com.apple.Safari AutoOpenSafeDownloads 2>/dev/null)
        if [ "$v" = "0" ]; then
          echo "ARMAZI_PASS: downloads are not opened automatically"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: Safari settings are not readable — grant Full Disk Access to your terminal, or check Safari > Settings > General"
        else
          echo "ARMAZI_FAIL: Safari opens 'safe' downloads automatically"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Safari > Settings > General → untick 'Open \"safe\" files after downloading'."
    frameworks: ["cis", "iso", "essentials"]

  - id: "ON.4"
    title: "Cross-site tracking is blocked"
    description: "Tracker blocking cuts profiling and the malicious advertising that carries scams."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        v=$(defaults read com.apple.Safari BlockStoragePolicy 2>/dev/null)
        if [ "$v" = "2" ]; then
          echo "ARMAZI_PASS: third-party cookies and data are blocked"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: Safari settings are not readable — check Safari > Settings > Privacy"
        else
          echo "ARMAZI_FAIL: cross-site tracking is not fully blocked"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Safari > Settings > Privacy > 'Prevent cross-site tracking'. In other browsers enable strict tracking protection."
    frameworks: ["iso"]

  - id: "ON.5"
    title: "A content blocker is installed"
    description: "Blocking ads and trackers removes a whole delivery channel for scams and drive-by malware."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        found=""
        for app in "AdGuard" "AdGuard for Safari" "1Blocker" "Wipr" "Wipr 2" "Ghostery Lite" "StopTheMadness" "uBlock Origin" "Vinegar"; do
          if [ -d "/Applications/$app.app" ] || [ -d "$HOME/Applications/$app.app" ]; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "ARMAZI_PASS: content blocker installed —$found"
        else
          echo "ARMAZI_REVIEW: no content blocker found (browser extensions are not visible to this check)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Install a content blocker such as AdGuard, 1Blocker, or uBlock Origin and enable it in every browser you use."
    frameworks: ["iso"]

  - id: "ON.6"
    title: "DNS filtering is configured"
    description: "A filtering resolver blocks malware, phishing, and scam domains before the browser reaches them."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        servers=$(scutil --dns 2>/dev/null | awk '/nameserver\[[0-9]+\]/ {print $3}' | sort -u)
        known="9.9.9.9|149.112.112.112|1.1.1.2|1.0.0.2|1.1.1.3|1.0.0.3|208.67.222.222|208.67.220.220|208.67.222.123|94.140.14.14|94.140.15.15|185.228.168.9|185.228.169.9|76.76.2.0|76.76.19.19"
        if echo "$servers" | grep -qE "^($known)$"; then
          echo "ARMAZI_PASS: a filtering resolver is in use"
        elif echo "$servers" | grep -qE "^45\.90\.(28|30)\."; then
          echo "ARMAZI_PASS: NextDNS resolver is in use"
        elif scutil --dns 2>/dev/null | grep -qiE "DNS over (HTTPS|TLS)"; then
          echo "ARMAZI_PASS: an encrypted DNS profile is active"
        else
          echo "ARMAZI_REVIEW: resolvers in use: $(echo $servers | tr '\n' ' ')"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Point DNS at a filtering resolver (Quad9 9.9.9.9, Cloudflare 1.1.1.2, NextDNS, AdGuard DNS) in System Settings > Network > Details > DNS, or install an encrypted DNS profile."
    frameworks: ["nist-csf", "essentials"]

  - id: "ON.7"
    title: "A VPN is available for untrusted networks"
    description: "On public Wi-Fi a VPN keeps traffic away from whoever else is on the network."
    category: "online_safety"
    level: 1
    scored: false
    audit:
      command: |
        configured=$(scutil --nc list 2>/dev/null | sed 1d | grep -c "[^[:space:]]")
        found=""
        for app in "Tailscale" "WireGuard" "Mullvad VPN" "ProtonVPN" "NordVPN" "ExpressVPN" "Cloudflare WARP" "Viscosity" "Tunnelblick"; do
          if [ -d "/Applications/$app.app" ] || [ -d "$HOME/Applications/$app.app" ]; then
            found="$found $app"
          fi
        done
        if [ "$configured" -gt 0 ]; then
          echo "ARMAZI_PASS: $configured VPN configuration(s) present"
        elif [ -n "$found" ]; then
          echo "ARMAZI_PASS: VPN client installed —$found"
        else
          echo "ARMAZI_REVIEW: no VPN configuration or client found"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Set up a reputable no-logs VPN, or iCloud Private Relay, and turn it on before using public Wi-Fi."
    frameworks: ["iso", "nist-csf"]

  - id: "ON.8"
    title: "iCloud Private Relay is enabled"
    description: "Private Relay hides your IP address and DNS lookups from network operators and site trackers."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        icloud_service() {
          defaults read MobileMeAccounts 2>/dev/null | awk -v want="$1" '
            /^[[:space:]]*\{/ { on = 0; nm = "" }
            /Enabled = 1;/ { on = 1 }
            /Name = / { line = $0; gsub(/[";]/, "", line); sub(/^[^=]*= */, "", line); nm = line }
            /^[[:space:]]*\}/ { if (nm == want && on == 1) f = 1 }
            END { exit (f ? 0 : 1) }'
        }
        if icloud_service "PRIVATE_RELAY"; then
          echo "ARMAZI_PASS: iCloud Private Relay is on"
        else
          echo "ARMAZI_REVIEW: Private Relay is off or not part of your iCloud plan"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > [your name] > iCloud > Private Relay → turn on (requires iCloud+)."
    frameworks: ["iso"]

  - id: "ON.9"
    title: "Message and mail filtering is on"
    description: "Filtering unknown senders in Mail and Messages cuts the phishing and smishing that reaches you."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        id="ON.9"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: turn on unknown-sender filtering and spam protection in Mail, Messages, and WhatsApp, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Messages > Settings > 'Filter Unknown Senders'; enable your mail provider's spam and phishing protection. Then: echo ON.9 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf", "essentials"]

  - id: "ON.10"
    title: "Family and child protections are configured"
    description: "Shared or family machines need content filtering and app limits for the accounts that use them."
    category: "online_safety"
    level: 2
    scored: false
    audit:
      command: |
        id="ON.10"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        elif defaults read com.apple.applicationaccess 2>/dev/null | grep -q "restrict"; then
          echo "ARMAZI_PASS: content restrictions are configured for this account"
        else
          echo "ARMAZI_REVIEW: configure Screen Time content restrictions for family accounts, or attest with: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Screen Time > Content & Privacy for each child account. Then: echo ON.10 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso"]

  # ──────────────────────────────────────────────
  # Home & Network Protection
  # ──────────────────────────────────────────────

  - id: "NW.1"
    title: "The firewall is on"
    description: "The application firewall blocks unsolicited incoming connections on untrusted networks."
    category: "home_network"
    level: 1
    scored: true
    audit:
      command: |
        state=$(/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>&1)
        if echo "$state" | grep -qi "enabled"; then
          echo "ARMAZI_PASS: firewall is on"
        elif echo "$state" | grep -qi "disabled"; then
          echo "ARMAZI_FAIL: firewall is off"
        else
          echo "ARMAZI_REVIEW: could not read the firewall state ($state)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Network > Firewall → turn on. Or: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on"
    frameworks: ["cis", "iso", "nist-csf", "essentials", "soc"]

  - id: "NW.2"
    title: "Firewall stealth mode is on"
    description: "Stealth mode stops the Mac answering probes, so it is not discoverable on café or hotel networks."
    category: "home_network"
    level: 2
    scored: false
    audit:
      command: |
        state=$(/usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode 2>&1)
        if echo "$state" | grep -qi "enabled"; then
          echo "ARMAZI_PASS: stealth mode is on"
        elif echo "$state" | grep -qi "disabled"; then
          echo "ARMAZI_FAIL: stealth mode is off"
        else
          echo "ARMAZI_REVIEW: could not read the stealth mode state ($state)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setstealthmode on"
    frameworks: ["cis", "iso"]

  - id: "NW.3"
    title: "The Wi-Fi network is encrypted"
    description: "Open or WEP networks expose everything that is not itself encrypted."
    category: "home_network"
    level: 1
    scored: true
    audit:
      command: |
        wifi_if=$(networksetup -listallhardwareports 2>/dev/null | awk '/Wi-Fi|AirPort/{getline; print $NF}')
        if [ -z "$wifi_if" ]; then
          echo "ARMAZI_PASS: no Wi-Fi interface (wired connection)"
          exit 0
        fi
        info=$(system_profiler SPAirPortDataType 2>/dev/null)
        security=$(echo "$info" | grep -A8 "Current Network" | grep -i "security" | head -1)
        if echo "$security" | grep -qiE "WPA3|WPA2"; then
          echo "ARMAZI_PASS: Wi-Fi uses $(echo "$security" | xargs)"
        elif echo "$security" | grep -qiE "WEP|none|open"; then
          echo "ARMAZI_FAIL: Wi-Fi uses weak or no encryption"
        else
          echo "ARMAZI_REVIEW: not connected to Wi-Fi, or the encryption could not be read"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Use WPA3 (or WPA2-AES) on your home router and avoid open networks; use a VPN when you cannot."
    frameworks: ["cis", "iso", "essentials"]

  - id: "NW.4"
    title: "No new devices appeared on the local network"
    description: "Tracks the hardware addresses seen on your network and flags ones that were not there before."
    category: "home_network"
    level: 1
    scored: false
    audit:
      command: |
        dir="$HOME/.config/armazi"
        known="$dir/known-devices.txt"
        mkdir -p "$dir"
        tmp=$(mktemp "${TMPDIR:-/tmp}/armazi_devices.XXXXXX") || exit 0
        arp -an 2>/dev/null | awk '{print $4}' | grep -E "^([0-9a-f]{1,2}:){5}[0-9a-f]{1,2}$" | sort -u > "$tmp"
        if [ ! -s "$tmp" ]; then
          rm -f "$tmp"
          echo "ARMAZI_REVIEW: the ARP table is empty — no local network activity to compare"
          exit 0
        fi
        if [ ! -f "$known" ]; then
          mv "$tmp" "$known"
          echo "ARMAZI_PASS: baseline recorded ($(grep -c . "$known") device(s))"
          exit 0
        fi
        new=$(comm -13 "$known" "$tmp")
        rm -f "$tmp"
        if [ -z "$new" ]; then
          echo "ARMAZI_PASS: no unrecognised devices"
        else
          echo "ARMAZI_FAIL: new device(s) seen: $(echo $new | tr '\n' ' ')"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Identify the new devices on your router's client list. Once they are known, accept them: arp -an | awk '{print $4}' | grep -E '^([0-9a-f]{1,2}:){5}[0-9a-f]{1,2}$' | sort -u > ~/.config/armazi/known-devices.txt"
    frameworks: ["nist-csf", "iso"]

  - id: "NW.5"
    title: "Remote access services are not listening"
    description: "SSH, screen sharing, file sharing, and remote management are reachable by anyone on the same network."
    category: "home_network"
    level: 1
    scored: true
    audit:
      command: |
        open=""
        ports=$(netstat -an -p tcp 2>/dev/null | awk '$6 == "LISTEN" {print $4}' | grep -v "^127\.0\.0\.1\." | grep -v "^::1\." | sed 's/.*\.//' | sort -un)
        for p in 22 445 548 3283 5900; do
          echo "$ports" | grep -qx "$p" && open="$open $p"
        done
        if [ -z "$open" ]; then
          echo "ARMAZI_PASS: no remote access ports are listening"
        else
          echo "ARMAZI_FAIL: listening on port(s)$open (22=SSH 445=SMB 548=AFP 3283=ARD 5900=screen sharing)"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > General > Sharing → turn off Remote Login, Screen Sharing, Remote Management, and File Sharing unless you actively use them."
    frameworks: ["cis", "iso", "nist-csf", "essentials"]

  - id: "NW.6"
    title: "AirDrop is not open to everyone"
    description: "AirDrop set to Everyone lets strangers nearby send you files and see your device name."
    category: "home_network"
    level: 1
    scored: true
    audit:
      command: |
        mode=$(defaults read com.apple.sharingd DiscoverableMode 2>/dev/null)
        case "$mode" in
          "Everyone") echo "ARMAZI_FAIL: AirDrop is discoverable by everyone" ;;
          "") echo "ARMAZI_PASS: AirDrop discovery is not set to Everyone" ;;
          *) echo "ARMAZI_PASS: AirDrop is set to $mode" ;;
        esac
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Control Centre > AirDrop → Contacts Only, or Receiving Off."
    frameworks: ["cis", "iso", "essentials"]

  - id: "NW.7"
    title: "Smart-home devices are on a separate network"
    description: "Cameras, TVs, and speakers rarely get patched; keeping them off your main network limits what they can reach."
    category: "home_network"
    level: 2
    scored: false
    audit:
      command: |
        id="NW.7"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: move IoT devices to a guest or IoT SSID, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Create a guest or IoT network on your router and move smart devices onto it. Then: echo NW.7 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "nist-csf"]

  - id: "NW.8"
    title: "The router was hardened"
    description: "Default router passwords, old firmware, WPS, and remote administration are the weakest points of most home networks."
    category: "home_network"
    level: 1
    scored: false
    audit:
      command: |
        id="NW.8"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        gw=$(netstat -rn 2>/dev/null | awk '$1 == "default" {print $2; exit}')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested (gateway ${gw:-unknown})"
        else
          echo "ARMAZI_REVIEW: change the admin password on ${gw:-your router}, update its firmware, disable WPS and remote admin, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Sign in to your router, set a unique admin password, update firmware, turn off WPS and WAN-side administration. Then: echo NW.8 >> ~/.config/armazi/attested.txt"
    frameworks: ["cis", "iso", "essentials"]

  # ──────────────────────────────────────────────
  # Privacy & Personal Safety
  # ──────────────────────────────────────────────

  - id: "PV.1"
    title: "Personalised advertising is off"
    description: "Apple's ad targeting profiles you across its services."
    category: "privacy_footprint"
    level: 1
    scored: true
    audit:
      command: |
        v=$(defaults read com.apple.AdLib allowApplePersonalizedAdvertising 2>/dev/null)
        if [ "$v" = "0" ]; then
          echo "ARMAZI_PASS: personalised ads are off"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: the advertising preference has not been set"
        else
          echo "ARMAZI_FAIL: personalised ads are on"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Privacy & Security > Apple Advertising → turn off Personalised Ads. Or: defaults write com.apple.AdLib allowApplePersonalizedAdvertising -bool false"
    frameworks: ["iso"]

  - id: "PV.2"
    title: "Diagnostic data is not shared"
    description: "Crash and usage reports can carry fragments of the documents and sites you were using."
    category: "privacy_footprint"
    level: 1
    scored: false
    audit:
      command: |
        v=$(defaults read "/Library/Application Support/CrashReporter/DiagnosticMessagesHistory.plist" AutoSubmit 2>/dev/null)
        if [ "$v" = "0" ]; then
          echo "ARMAZI_PASS: analytics sharing is off"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: could not read the analytics preference"
        else
          echo "ARMAZI_FAIL: analytics are shared with Apple"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Privacy & Security > Analytics & Improvements → turn off Share Mac Analytics."
    frameworks: ["iso"]

  - id: "PV.3"
    title: "Siri and dictation data is not shared"
    description: "Audio recordings sent for improvement leave your voice and requests with a third party."
    category: "privacy_footprint"
    level: 2
    scored: false
    audit:
      command: |
        v=$(defaults read com.apple.assistant.support "Siri Data Sharing Opt-In Status" 2>/dev/null)
        if [ "$v" = "2" ]; then
          echo "ARMAZI_PASS: Siri audio sharing is off"
        elif [ -z "$v" ]; then
          echo "ARMAZI_REVIEW: the Siri sharing preference has not been set"
        else
          echo "ARMAZI_FAIL: Siri audio may be shared for improvement"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "System Settings > Privacy & Security > Analytics & Improvements → turn off Improve Siri & Dictation."
    frameworks: ["iso"]

  - id: "PV.4"
    title: "An encrypted messaging app is installed"
    description: "End-to-end encrypted messaging keeps conversations and shared files private in transit and at rest."
    category: "privacy_footprint"
    level: 1
    scored: false
    audit:
      command: |
        found=""
        for app in "Signal" "Wire" "Element" "Session" "Threema" "Proton Mail" "Proton Drive" "Keybase" "Wickr Me"; do
          if [ -d "/Applications/$app.app" ] || [ -d "$HOME/Applications/$app.app" ]; then
            found="$found $app"
          fi
        done
        if [ -n "$found" ]; then
          echo "ARMAZI_PASS: encrypted messaging available —$found"
        else
          echo "ARMAZI_REVIEW: no end-to-end encrypted messenger found on this Mac"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Install Signal (or another audited end-to-end encrypted messenger) and use it for anything sensitive, including file transfers."
    frameworks: ["iso", "nist-csf"]

  - id: "PV.5"
    title: "Data broker removal is in progress"
    description: "People-search sites publish your address, phone number, and relatives, which fuels phishing and fraud."
    category: "privacy_footprint"
    level: 1
    scored: false
    audit:
      command: |
        id="PV.5"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        line=$(grep -E "^${esc}([[:space:]]|$)" "$att" 2>/dev/null | head -1)
        if [ -z "$line" ]; then
          echo "ARMAZI_REVIEW: submit removal requests to people-search sites, then run: echo \"$id $(date +%Y-%m-%d)\" >> $att"
        else
          d=$(echo "$line" | awk '{print $2}')
          ts=$(date -j -f "%Y-%m-%d" "${d:-1970-01-01}" "+%s" 2>/dev/null)
          if [ -z "$d" ]; then
            echo "ARMAZI_PASS: $id attested"
          elif [ -n "$ts" ] && [ $(( ( $(date +%s) - ts ) / 86400 )) -le 365 ]; then
            echo "ARMAZI_PASS: $id attested on $d"
          else
            echo "ARMAZI_FAIL: last reviewed on $d — brokers relist, so repeat this yearly"
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Opt out of the major people-search sites yourself or through a removal service, and repeat yearly. Then: echo \"PV.5 $(date +%Y-%m-%d)\" >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "nist-csf"]

  - id: "PV.6"
    title: "Social media privacy was reviewed in the last year"
    description: "Public posts, tagged photos, and old accounts are the raw material for impersonation and targeted scams."
    category: "privacy_footprint"
    level: 2
    scored: false
    audit:
      command: |
        id="PV.6"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        line=$(grep -E "^${esc}([[:space:]]|$)" "$att" 2>/dev/null | head -1)
        if [ -z "$line" ]; then
          echo "ARMAZI_REVIEW: review the privacy settings on your social accounts, then run: echo \"$id $(date +%Y-%m-%d)\" >> $att"
        else
          d=$(echo "$line" | awk '{print $2}')
          ts=$(date -j -f "%Y-%m-%d" "${d:-1970-01-01}" "+%s" 2>/dev/null)
          if [ -z "$d" ]; then
            echo "ARMAZI_PASS: $id attested"
          elif [ -n "$ts" ] && [ $(( ( $(date +%s) - ts ) / 86400 )) -le 365 ]; then
            echo "ARMAZI_PASS: $id reviewed on $d"
          else
            echo "ARMAZI_FAIL: last reviewed on $d — review again"
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Check who can see your posts, lock down old accounts, and search for impersonation profiles. Then: echo \"PV.6 $(date +%Y-%m-%d)\" >> ~/.config/armazi/attested.txt"
    frameworks: ["iso"]

  # ──────────────────────────────────────────────
  # Response Readiness
  # ──────────────────────────────────────────────

  - id: "RS.1"
    title: "Account recovery is prepared"
    description: "Recovery keys, recovery contacts, and printed backup codes are what get you back in when an account is taken."
    category: "response_readiness"
    level: 1
    scored: false
    audit:
      command: |
        id="RS.1"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: store your FileVault recovery key and account backup codes somewhere safe, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Save the FileVault recovery key and each account's backup codes in your password manager, and add an Apple recovery contact. Then: echo RS.1 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "nist-csf", "soc"]

  - id: "RS.2"
    title: "Identity theft response cover is in place"
    description: "Knowing in advance who to call — insurer, bank, employer — is what turns an incident into a bad afternoon rather than a bad year."
    category: "response_readiness"
    level: 2
    scored: false
    audit:
      command: |
        id="RS.2"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: write down who to contact if your identity or money is stolen, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Check whether your bank, insurer, or employer offers identity theft response, and keep the numbers offline. Then: echo RS.2 >> ~/.config/armazi/attested.txt"
    frameworks: ["nist-csf", "soc"]

  - id: "RS.3"
    title: "The security posture was reviewed this month"
    description: "A monthly look at this report is what keeps the score from drifting."
    category: "response_readiness"
    level: 1
    scored: false
    audit:
      command: |
        id="RS.3"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        line=$(grep -E "^${esc}([[:space:]]|$)" "$att" 2>/dev/null | head -1)
        d=$(echo "$line" | awk '{print $2}')
        if [ -z "$d" ]; then
          echo "ARMAZI_REVIEW: record this review with: echo \"$id $(date +%Y-%m-%d)\" >> $att"
        else
          ts=$(date -j -f "%Y-%m-%d" "$d" "+%s" 2>/dev/null)
          if [ -n "$ts" ] && [ $(( ( $(date +%s) - ts ) / 86400 )) -le 31 ]; then
            echo "ARMAZI_PASS: reviewed on $d"
          else
            echo "ARMAZI_FAIL: last reviewed on $d"
          fi
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Run 'armazi scan --profile personal' monthly and update the date: echo \"RS.3 $(date +%Y-%m-%d)\" >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "nist-csf", "soc"]

  - id: "RS.4"
    title: "Everyone in the household is covered"
    description: "Attackers reach you through the least protected person who shares your network and your accounts."
    category: "response_readiness"
    level: 2
    scored: false
    audit:
      command: |
        id="RS.4"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested"
        else
          echo "ARMAZI_REVIEW: run this check-up on the other devices in your household, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Set up the same protections — password manager, MFA, backups, updates — for partners, children, and parents. Then: echo RS.4 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso"]

  - id: "RS.5"
    title: "Work and personal use are separated"
    description: "Personal accounts on a work machine (and the reverse) turn one compromise into two."
    category: "response_readiness"
    level: 2
    scored: false
    audit:
      command: |
        id="RS.5"
        att="$HOME/.config/armazi/attested.txt"
        esc=$(echo "$id" | sed 's/\./\\./g')
        managed=""
        if profiles list 2>/dev/null | grep -qi "attribute"; then
          managed=" (this Mac has configuration profiles installed)"
        fi
        if [ -f "$att" ] && grep -qE "^${esc}([[:space:]]|$)" "$att"; then
          echo "ARMAZI_PASS: $id attested$managed"
        else
          echo "ARMAZI_REVIEW: keep work and personal accounts, browsers, and storage separate$managed, then run: echo $id >> $att"
        fi
      match:
        type: "contains"
        value: "ARMAZI_PASS"
    remediation: "Use separate browser profiles and accounts for work and personal use, and do not store work files in personal cloud storage. Then: echo RS.5 >> ~/.config/armazi/attested.txt"
    frameworks: ["iso", "soc"]
